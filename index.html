<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub 聊天室</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0d1117;color:#c9d1d9;display:flex;justify-content:center;padding:20px}
    #app{width:100%;max-width:600px;background:#161b22;border:1px solid #30363d;border-radius:6px;display:flex;flex-direction:column;height:90vh}
    .header{padding:16px;border-bottom:1px solid #30363d;font-weight:600}
    #messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
    .msg{background:#21262d;border-radius:6px;padding:8px 12px;max-width:80%;word-wrap:break-word}
    .msg.self{background:#1f6feb;align-self:flex-end}
    .msg .author{font-weight:600;font-size:0.85em;color:#58a6ff}
    .msg .time{font-size:0.75em;color:#8b949e;margin-left:8px}
    .msg .body{margin-top:4px}
    .input-area{padding:12px;border-top:1px solid #30363d;display:flex;gap:8px}
    #inputMsg{flex:1;padding:8px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;outline:none}
    button{padding:8px 16px;background:#238636;border:1px solid #2ea043;border-radius:6px;color:white;cursor:pointer}
    button:hover{background:#2ea043}
  </style>
</head>
<body>
<div id="app">
  <div class="header">💬 GitHub Issues 聊天室</div>
  <div id="messages"></div>
  <div class="input-area">
    <input type="text" id="inputMsg" placeholder="输入消息..." disabled>
    <button id="sendBtn" disabled>发送</button>
  </div>
</div>

<script>
  // ========== 必须修改下面4个配置 ==========
  const OWNER = '你的GitHub用户名';        // 改成你的 GitHub 用户名
  const REPO = '你的仓库名';               // 改成仓库名，比如 chatroom
  const ISSUE_NUMBER = 1;                 // 之前创建的 Issue 编号
  const TOKEN = 'ghp_你的Token';          // 第二步生成的 Token，格式 ghp_xxx

  const messagesDiv = document.getElementById('messages');
  const inputMsg = document.getElementById('inputMsg');
  const sendBtn = document.getElementById('sendBtn');

  let currentUser = '';

  // 检查 Token 是否已正确填写
  if (TOKEN && TOKEN !== 'ghp_你的Token') {
    inputMsg.disabled = false;
    sendBtn.disabled = false;
    // 获取 Token 对应的 GitHub 用户名作为自己的昵称
    fetch('https://api.github.com/user', {
      headers: { Authorization: `token ${TOKEN}` }
    }).then(r => r.json()).then(data => {
      currentUser = data.login || '我';
    }).catch(() => {});
  } else {
    inputMsg.disabled = true;
    sendBtn.disabled = true;
    inputMsg.placeholder = '未配置发送 Token，只读模式';
  }

  // 从 Issue 拉取所有评论并显示
  async function loadMessages() {
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}/comments`;
    try {
      const response = await fetch(url);
      const comments = await response.json();
      renderMessages(comments);
    } catch (e) {
      // 忽略错误，可能是仓库不存在或网络问题
    }
  }

  function renderMessages(comments) {
    messagesDiv.innerHTML = '';
    comments.forEach(comment => {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg';
      // 如果当前登录用户是这条消息的作者，就显示为蓝色自己的消息
      if (currentUser && comment.user.login === currentUser) {
        msgDiv.classList.add('self');
      }
      msgDiv.innerHTML = `
        <span class="author">${escapeHtml(comment.user.login)}</span>
        <span class="time">${new Date(comment.created_at).toLocaleString()}</span>
        <div class="body">${escapeHtml(comment.body)}</div>
      `;
      messagesDiv.appendChild(msgDiv);
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function escapeHtml(text) {
    const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
    return text.replace(/[&<>"']/g, m => map[m]);
  }

  // 发送消息（就是给 Issue 添加一条评论）
  async function sendMessage() {
    const text = inputMsg.value.trim();
    if (!text) return;
    sendBtn.disabled = true;
    inputMsg.disabled = true;
    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/issues/${ISSUE_NUMBER}/comments`, {
        method: 'POST',
        headers: {
          Authorization: `token ${TOKEN}`,
          'Content-Type': 'application/json',
          Accept: 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({ body: text })
      });
      if (!res.ok) throw new Error(await res.text());
      inputMsg.value = '';
      await loadMessages();
    } catch (error) {
      alert('发送失败: ' + error.message);
    }
    sendBtn.disabled = false;
    inputMsg.disabled = false;
    inputMsg.focus();
  }

  sendBtn.addEventListener('click', sendMessage);
  inputMsg.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // 初次加载，每10秒自动刷新
  loadMessages();
  setInterval(loadMessages, 10000);
</script>
</body>
</html>
